<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#081333" />
  <title>Runner – Halvmaraton sub 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="17" cy="4" r="2"/>
          <path d="M15.5 8.5 L12 13 l3 3 l-1 6"/>
          <path d="M12 13 l-4 -1 l-3 4"/>
          <path d="M15 16 l3 1 l2 5"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">Runner</div>
        <div class="brand-sub">Halvmaraton · sub 2 timer</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="stat-runs">0</div>
        <div class="stat-lbl">Løb</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="stat-km">0</div>
        <div class="stat-lbl">Km</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="stat-longest">0</div>
        <div class="stat-lbl">Længst</div>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn tab-btn--active" data-tab="tab-plan">Plan</button>
    <button class="tab-btn" data-tab="tab-log">Logbog</button>
  </nav>

  <main>
    <section id="tab-plan" class="tab-panel tab-panel--active">
      <div id="plan-container"></div>
      <div class="extend">
        <button id="extend-btn" class="extend-btn">+ 12 uger mere</button>
      </div>
    </section>

    <section id="tab-log" class="tab-panel">
      <ul id="log-list" class="log"></ul>
    </section>
  </main>

  <footer class="footer">
    <span id="storage-status" class="status">–</span>
  </footer>

  <dialog id="training-dialog" class="dialog">
    <form id="training-form" method="dialog" class="dialog-form">
      <div class="dialog-head">
        <div class="dialog-week-info" id="dlg-week-info"></div>
        <h3 class="dialog-title" id="dlg-title"></h3>
        <p class="dialog-detail" id="dlg-detail"></p>
      </div>

      <div class="dialog-body">
        <label class="field">
          <span class="field-lbl">Dato</span>
          <input type="date" id="dlg-date" required />
        </label>
        <div class="field-row">
          <label class="field">
            <span class="field-lbl">Distance (km)</span>
            <input type="number" id="dlg-distance" step="0.01" min="0" required inputmode="decimal" />
          </label>
          <label class="field">
            <span class="field-lbl">Tempo (min:sek/km)</span>
            <input type="text" id="dlg-pace" placeholder="5:40" inputmode="numeric" />
          </label>
        </div>
        <label class="field">
          <span class="field-lbl">Rute-URL (Footpath eller lign.)</span>
          <input type="url" id="dlg-route" placeholder="https://footpathapp.com/routes/..." inputmode="url" />
        </label>
        <p class="dialog-error" id="dlg-error" hidden></p>
      </div>

      <div class="dialog-actions">
        <button type="button" id="dlg-delete" class="btn btn--danger">Fjern</button>
        <button type="button" id="dlg-cancel" class="btn btn--ghost">Annullér</button>
        <button type="submit" class="btn btn--primary">Gem</button>
      </div>
    </form>
  </dialog>

  <script src="js/firebase-config.js"></script>
  <script src="js/plan.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
